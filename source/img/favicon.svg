      <!-- 交叉处的缺口，做出莫比乌斯扭转 -->
      <path d="M35.94 21.76 L35.56 21.43 L35.19 21.10 L34.83 20.76 L34.46 20.42 L34.10 20.08 L33.75 19.73 L33.40 19.39 L33.05 19.04 L32.70 18.70 L32.35 18.35 L32.00 18.00 L31.65 17.65 L31.30 17.30 L30.95 16.96 L30.60 16.61 L30.25 16.27 L29.90 15.92 L29.54 15.58 L29.17 15.24 L28.81 14.90 L28.44 14.57 L28.06 14.24" stroke="#061019" stroke-width="6.0" stroke-linecap="round"/>
      <path d="M35.94 21.76 L35.56 21.43 L35.19 21.10 L34.83 20.76 L34.46 20.42 L34.10 20.08 L33.75 19.73 L33.40 19.39 L33.05 19.04 L32.70 18.70 L32.35 18.35 L32.00 18.00 L31.65 17.65 L31.30 17.30 L30.95 16.96 L30.60 16.61 L30.25 16.27 L29.90 15.92 L29.54 15.58 L29.17 15.24 L28.81 14.90 L28.44 14.57 L28.06 14.24" stroke="url(#ring)" stroke-width="4.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 内描边：一圈极淡的亮边，深色标签栏里更立体 -->
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="12.6" stroke="#9dc0d4" stroke-opacity=".22" stroke-width="1.2" fill="none"/>
</svg>
