<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!--
    纪元 · 站点图标
    ---------------------------------------------------------------
    图形取导航左上角那枚莫比乌斯 ∞（同 source/custom/assets/mobius.svg 的几何），
    重新排版成方形：深空底 + 圆角，∞ 用钢青到冷白的高对比描边，交叉处留一道
    细缺口做出"扭转"错觉。
    favicon 在 16×16 下会糊，所以这里的取向是：更粗的线、更强的对比、去掉
    所有细节装饰（网格、星点、辉光都去掉了，只留一层很浅的底色渐变）。
  -->
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1826"/>
      <stop offset=".55" stop-color="#060f1a"/>
      <stop offset="1" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="ring" x1="10" y1="22" x2="54" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf5fc"/>
      <stop offset=".42" stop-color="#a8cee2"/>
      <stop offset=".76" stop-color="#93b8cc"/>
      <stop offset="1" stop-color="#7fa3b8"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="64" height="64" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 底：深空冷底 + 一点点钢青辉光 -->
    <rect width="64" height="64" fill="url(#bg)"/>
    <circle cx="20" cy="14" r="26" fill="#8fb6cc" opacity=".10"/>
    <circle cx="52" cy="54" r="22" fill="#4d6d82" opacity=".12"/>

    <!-- ∞ 本体：把 64×36 的原始图形缩到 48×27 再居中（缩放 .75，位移 x=8 y=18.5） -->
    <g transform="translate(6.7 16.2) scale(.88)">
